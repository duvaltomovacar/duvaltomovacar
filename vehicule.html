
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Détails du véhicule - DUVAL TOMOVA CAR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #222;
    }
    .vehicle-details {
      max-width: 800px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #00000015;
    }
    h1 { color: #0b3d91; }
    .photos img {
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      margin: 8px 0;
      border-radius: 8px;
    }
    .button {
      display: inline-block;
      background: #0b3d91;
      color: white;
      padding: 12px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      margin: 8px 8px 0 0;
    }
    .whatsapp { background: #111827; }
  </style>
</head>
<body>
  <main class="vehicle-details" id="vehicle-details">
    <p>Chargement du véhicule...</p>
  </main>

  <script>
  (async function () {
    const container = document.getElementById("vehicle-details");
    const id = new URLSearchParams(location.search).get("id");

    try {
      const response = await fetch(
        "https://duvaltomova-publish.duvaltomovacar.workers.dev/api/vehicles"
      );
      if (!response.ok) throw new Error("Chargement impossible");

      const data = await response.json();
      const vehicle = (data.vehicles || []).find(v => String(v.id) === id);

      if (!vehicle) {
        container.innerHTML = "<h1>Véhicule introuvable</h1><p>Vérifiez le lien ou retournez au catalogue.</p><a class='button' href='index.html'>Retour aux véhicules</a>";
        return;
      }

      const title = document.createElement("h1");
      title.textContent = vehicle.title || "Véhicule";
      container.replaceChildren(title);

      const photos = document.createElement("div");
      photos.className = "photos";
      (vehicle.images || []).forEach((path, i) => {
        const img = document.createElement("img");
        img.src = path.startsWith("http") ? path : "/duvaltomovacar" + (path.startsWith("/") ? path : "/" + path);
        img.alt = (vehicle.title || "Véhicule") + " photo " + (i + 1);
        photos.appendChild(img);
      });
      container.appendChild(photos);

      const description = document.createElement("p");
      description.textContent = vehicle.description || "Aucune description disponible.";
      container.appendChild(description);

      const price = document.createElement("h2");
      price.textContent = "Prix : " + Number(vehicle.price).toLocaleString("fr-FR") + " €";
      container.appendChild(price);

      const whatsapp = document.createElement("a");
      whatsapp.className = "button whatsapp";
      whatsapp.href = "https://wa.me/34682879855?text=" + encodeURIComponent("Bonjour, je suis intéressé par " + (vehicle.title || "ce véhicule") + ".");
      whatsapp.target = "_blank";
      whatsapp.rel = "noopener noreferrer";
      whatsapp.textContent = "Demander sur WhatsApp";
      container.appendChild(whatsapp);

      const back = document.createElement("a");
      back.className = "button";
      back.href = "index.html#vehicules";
      back.textContent = "Retour aux véhicules";
      container.appendChild(back);
    } catch (error) {
      container.textContent = "Impossible de charger les détails du véhicule. Veuillez réessayer.";
      console.error(error);
    }
  })();
  </script>
</body>
</html>
