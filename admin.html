<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration | DUVAL TOMOVA CAR</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #222;
    }
    main {
      max-width: 760px;
      margin: 20px auto;
      padding: 24px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px #00000012;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input, textarea, select, button {
      width: 100%;
      margin-top: 8px;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
    }
    input, textarea, select { border: 1px solid #ccc; }
    textarea { min-height: 110px; resize: vertical; }
    button {
      border: 0;
      background: #123d85;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #555; }
    .notice {
      padding: 12px;
      background: #fff7db;
      border-radius: 6px;
      line-height: 1.5;
    }
    #status { margin-top: 18px; white-space: pre-wrap; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>DUVAL TOMOVA CAR</h1>
  <h2>Administration des véhicules</h2>

  <p class="notice">
    Utilise uniquement ton secret d’administration.
    Les photos existantes ne sont pas modifiées lors de l’édition d’un véhicule.
  </p>

  <label for="admin-secret">Secret d’administration</label>
  <input id="admin-secret" type="password"
         autocomplete="current-password" required>

  <button type="button" id="load-button">Charger les véhicules existants</button>

  <label for="mode">Action souhaitée</label>
  <select id="mode">
    <option value="add">Ajouter une nouvelle voiture</option>
    <option value="edit">Modifier une voiture existante</option>
  </select>

  <div id="vehicle-picker" class="hidden">
    <label for="vehicle-select">Voiture à modifier</label>
    <select id="vehicle-select">
      <option value="">— Choisir une voiture —</option>
    </select>
  </div>

  <form id="vehicle-form">
    <label for="title">Marque et modèle</label>
    <input id="title" required
           placeholder="Ex. Mercedes-Benz GLC 220d">

    <label for="price">Prix en euros (€)</label>
    <input id="price" type="number" min="1" step="1"
           required placeholder="25000">

    <label for="description">Description</label>
    <textarea id="description"
              placeholder="Année, kilométrage, motorisation, état…"></textarea>

    <div id="photo-field">
      <label for="images">Photos de la nouvelle voiture</label>
      <input id="images" type="file"
             accept="image/jpeg,image/png,image/webp" multiple>
      <p class="notice">
        Maximum 6 photos, au format JPG, PNG ou WebP, de 1 Mo maximum chacune.
      </p>
    </div>

    <button id="save-button" type="submit">Publier la nouvelle voiture</button>
    <button id="clear-button" class="secondary" type="button">
      Effacer le formulaire
    </button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
const API = "https://duvaltomova-publish.duvaltomovacar.workers.dev";
const $ = id => document.getElementById(id);

let vehicles = [];

function headers() {
  return {
    "Content-Type": "application/json",
    "Authorization": "Bearer " + $("admin-secret").value.trim()
  };
}

function setStatus(message) {
  $("status").textContent = message;
}

function updateMode() {
  const editing = $("mode").value === "edit";
  $("vehicle-picker").classList.toggle("hidden", !editing);
  $("photo-field").classList.toggle("hidden", editing);
  $("save-button").textContent = editing
    ? "Enregistrer les modifications"
    : "Publier la nouvelle voiture";
}

async function loadVehicles() {
  if (!$("admin-secret").value.trim()) {
    setStatus("Entre d’abord ton secret d’administration.");
    return;
  }

  $("load-button").disabled = true;
  setStatus("Chargement des véhicules…");

  try {
    const response = await fetch(API + "/api/vehicles");
    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Impossible de charger les véhicules.");
    }

    vehicles = Array.isArray(data) ? data : data.vehicles;

    if (!Array.isArray(vehicles)) {
      throw new Error("Le format du catalogue est inattendu.");
    }

    $("vehicle-select").replaceChildren(
      new Option("— Choisir une voiture —", "")
    );

    vehicles.forEach(vehicle => {
      $("vehicle-select").add(
        new Option(vehicle.title || vehicle.id, vehicle.id)
      );
    });

    setStatus(vehicles.length + " véhicule(s) chargé(s).");
  } catch (error) {
    setStatus("Erreur : " + error.message);
  } finally {
    $("load-button").disabled = false;
  }
}

function selectVehicle() {
  const vehicle = vehicles.find(
    item => String(item.id) === $("vehicle-select").value
  );

  if (!vehicle) return;

  $("title").value = vehicle.title || "";
  $("price").value = vehicle.price || "";
  $("description").value = vehicle.description || "";
  setStatus("Véhicule sélectionné. Les photos seront conservées.");
}

$("load-button").addEventListener("click", loadVehicles);
$("mode").addEventListener("change", () => {
  $("vehicle-form").reset();
  updateMode();
  setStatus("");
});
$("vehicle-select").addEventListener("change", selectVehicle);

$("clear-button").addEventListener("click", () => {
  $("vehicle-form").reset();
  $("vehicle-select").value = "";
  setStatus("");
});

$("vehicle-form").addEventListener("submit", async event => {
  event.preventDefault();

  const editing = $("mode").value === "edit";
  const title = $("title").value.trim();
  const price = Number($("price").value);
  const description = $("description").value.trim();
  const secret = $("admin-secret").value.trim();

  if (!secret) {
    setStatus("Entre ton secret d’administration.");
    return;
  }

  if (!title || !Number.isFinite(price) || price <= 0) {
    setStatus("Vérifie le nom et le prix du véhicule.");
    return;
  }

  if (editing && !$("vehicle-select").value) {
    setStatus("Choisis le véhicule à modifier.");
    return;
  }

  const button = $("save-button");
  button.disabled = true;

  try {
    let endpoint;
    let payload = { title, price, description };

    if (editing) {
      endpoint = "/api/update-vehicle";
      payload.id = $("vehicle-select").value;
    } else {
      endpoint = "/api/publish";

      const files = Array.from($("images").files);

      if (files.length > 6) {
        throw new Error("Choisis au maximum 6 photos.");
      }

      payload.images = await Promise.all(files.map(file =>
        new Promise((resolve, reject) => {
          if (file.size > 1000000) {
            reject(new Error("La photo " + file.name + " dépasse 1 Mo."));
            return;
          }

          if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
            reject(new Error("Format de photo non accepté : " + file.name));
            return;
          }

          const reader = new FileReader();

          reader.onload = () => resolve({
            name: file.name,
            type: file.type,
            data: reader.result.split(",")[1]
          });

          reader.onerror = () => reject(
            new Error("Impossible de lire la photo " + file.name)
          );

          reader.readAsDataURL(file);
        })
      ));
    }

    setStatus(editing ? "Enregistrement des modifications…" : "Publication en cours…");

    const response = await fetch(API + endpoint, {
      method: "POST",
      headers: headers(),
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (!response.ok) {
      throw new Error(result.error || "L’opération a échoué.");
    }

    setStatus(result.message ||
      (editing ? "Textes du véhicule modifiés." : "Nouvelle voiture publiée."));

    $("vehicle-form").reset();

    if (editing) {
      await loadVehicles();
      $("vehicle-select").value = payload.id;
      selectVehicle();
    } else {
      await loadVehicles();
      $("mode").value = "add";
      updateMode();
    }
  } catch (error) {
    setStatus("Erreur : " + error.message);
  } finally {
    button.disabled = false;
  }
});

updateMode();
</script>
</body>
</html>
